# nginx.jp.conf — JP-specific nginx configuration for Tokyo deployment.
#
# Key features:
#   - Rate limiting per IP (防DoS攻撃)
#   - APPI compliance headers on all responses
#   - HTTPS redirect (TLS terminated at ALB — nginx handles HTTP only in this config)
#   - Conservative timeouts for API + WebSocket
#
# In production: place TLS certs at ALB layer; this nginx is HTTP-only on port 80.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format jp_json escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"x_request_id":"$http_x_request_id"'
        '}';

    access_log /var/log/nginx/access.log jp_json;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # ── Rate limiting zones ───────────────────────────────────────────────────
    # Public API: 60 req/min per IP (burst 20)
    limit_req_zone $binary_remote_addr zone=api_public:10m rate=60r/m;
    # Auth endpoints: 5 req/min per IP (tighter — login brute force)
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;
    # Admin endpoints: 30 req/min per IP
    limit_req_zone $binary_remote_addr zone=api_admin:10m rate=30r/m;
    # Webhook endpoints: 120 req/min (higher — external providers)
    limit_req_zone $binary_remote_addr zone=api_webhook:10m rate=120r/m;

    limit_req_status 429;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain application/json application/javascript text/css;

    # ── Upstream ──────────────────────────────────────────────────────────────
    upstream backend {
        server backend:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ── Global security headers (APPI compliance) ─────────────────────────
        # X-Content-Type-Options: prevent MIME sniffing
        add_header X-Content-Type-Options nosniff always;
        # X-Frame-Options: prevent clickjacking
        add_header X-Frame-Options DENY always;
        # Referrer-Policy: limit referrer leakage (APPI PII protection)
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # Strict-Transport-Security: force HTTPS in browser (set after TLS at ALB)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # APPI compliance banner header — parsed by frontend to show consent banner
        add_header X-APPI-Consent-Required "true" always;
        # CSP: restrictive default — adjust when frontend assets are served here
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none';" always;

        # ── Request ID propagation ─────────────────────────────────────────────
        add_header X-Request-ID $request_id always;

        # ── Timeout config ───────────────────────────────────────────────────
        client_max_body_size 20m;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # ── Auth endpoints (tight rate limit) ─────────────────────────────────
        location ~ ^/api/auth/ {
            limit_req zone=api_auth burst=3 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
        }

        # ── Admin endpoints ────────────────────────────────────────────────────
        location ~ ^/api/jp/admin/ {
            limit_req zone=api_admin burst=10 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
        }

        # ── Webhook endpoints (Komoju / CloudSign) ─────────────────────────────
        location ~ ^/api/jp/webhooks/ {
            limit_req zone=api_webhook burst=30 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
        }

        # ── WebSocket (chat) ───────────────────────────────────────────────────
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }

        # ── Health checks (no rate limit) ─────────────────────────────────────
        location ~ ^/(healthz|health)$ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            access_log off;
        }

        # ── All other API endpoints ────────────────────────────────────────────
        location / {
            limit_req zone=api_public burst=20 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
