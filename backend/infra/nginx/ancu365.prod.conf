# ancu365 Nginx config — HTTPS production
# Used in: docker compose --profile full up -d (Phase 09 deploy)
# Certs path: ./infra/certs/live/ancu365.vn/ (certbot or acme.sh)
# Rate limit zones defined at http context — include from nginx.conf or add here.

# Rate limiting zones (define before server blocks)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=tile_limit:10m rate=1000r/s;

# Tile cache path (ensure /var/cache/nginx exists in container)
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=tile_cache:10m max_size=2g inactive=7d;
proxy_cache_lock on;
proxy_cache_lock_timeout 5s;

# ── Upstream blocks ────────────────────────────────────────────────────────────
upstream backend {
    server backend:3000;
}

upstream martin {
    server martin:3000;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name ancu365.vn www.ancu365.vn;

    # Allow certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# ── HTTPS main server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name ancu365.vn www.ancu365.vn;

    ssl_certificate     /etc/nginx/certs/live/ancu365.vn/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/ancu365.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20M;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"             always;
    add_header X-Content-Type-Options "nosniff"                always;
    add_header X-XSS-Protection       "1; mode=block"          always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    # ── API → FastAPI backend ──────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ── Health check (no rate limit, no log) ──────────────────────────────────
    location /health {
        access_log off;
        proxy_pass http://backend/health;
    }

    # ── Vector tiles → Martin (cached 7 days) ─────────────────────────────────
    location /tiles/ {
        limit_req zone=tile_limit burst=50 nodelay;

        # Tile caching
        proxy_cache           tile_cache;
        proxy_cache_valid     200 7d;
        proxy_cache_key       "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status always;

        # Rewrite: /tiles/planning.parcels/z/x/y.pbf → /planning.parcels/z/x/y.pbf
        rewrite ^/tiles/(.*)$ /$1 break;
        proxy_pass http://martin;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS locked to production domain (Flutter web + mobile)
        add_header Access-Control-Allow-Origin  "https://ancu365.vn" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS"        always;
        add_header Access-Control-Allow-Headers "Content-Type"        always;
        add_header Access-Control-Max-Age       "86400"               always;
    }

    # ── Nominatim — BLOCK public access (FastAPI proxies internally) ──────────
    location /nominatim/ {
        deny all;
        return 403;
    }
}
