# ancu365 Nginx config — HTTP-only, local dev
# Used when running: docker compose --profile full up -d
# For local dev without nginx, backend is exposed directly on port 3000.

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    # ── API → FastAPI backend ─────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ── Health check ─────────────────────────────────────────────────────────
    location /health {
        proxy_pass http://backend:3000/health;
        access_log off;
    }

    # ── Vector tiles → Martin ─────────────────────────────────────────────────
    # Rewrite: /tiles/planning.parcels/z/x/y.pbf → /planning.parcels/z/x/y.pbf
    location /tiles/ {
        rewrite ^/tiles/(.*)$ /$1 break;
        proxy_pass http://martin:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS for Flutter web + mobile
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
    }
}
