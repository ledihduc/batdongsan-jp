# Alembic configuration file.
# Được dùng bởi `alembic` CLI và env.py.

[alembic]
# Script location (chứa env.py và versions/)
script_location = alembic

# Template file for new revision files
file_template = %%(rev)s_%%(slug)s

# Timezone cho timestamp trong revision filename
# timezone = UTC

# sqlalchemy.url: KHÔNG hardcode ở đây — inject từ DATABASE_URL env var trong env.py
# sqlalchemy.url = postgresql://user:pass@localhost/dbname

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
