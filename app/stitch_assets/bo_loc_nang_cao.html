<script>
        // Micro-interactions for the price slider
        const priceSlider = document.getElementById('price-slider');
        const priceDisplay = document.getElementById('price-display');
        
        priceSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            const price = val * 0.5; // Simple math for demo
            priceDisplay.textContent = `0tr - ${price}tr VNĐ`;
        });

        // Scroll detection to show/hide global nav if needed, though for this specific view 
        // the "Apply" button is the primary footer. This script ensures clean transitions.
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('global-nav');
            if (window.scrollY > 200) {
                // Potential scroll behavior logic
            }
        });

        // Initialize checkboxes with active scale effect
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const parent = this.closest('label');
                if (this.checked) {
                    parent.style.transform = 'scale(1.05)';
                    setTimeout(() => parent.style.transform = 'scale(1)', 150);
                }
            });
        });
    </script>
